name: 시각적 회귀 테스트

# HANDOVER.md 6장 "실제 브라우저 정기 시각 테스트" 항목 자동화.
# - 매일 한 번 실제 배포 사이트(GitHub Pages)를 대상으로 주요 화면 스크린샷을 찍어
#   기준(baseline) 이미지와 비교합니다.
# - main/master에 push될 때도 실행해서, 배포 직후 바로 확인할 수 있게 합니다.
# - 사람이 원할 때 언제든 수동 실행(workflow_dispatch) 가능합니다.
on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST (UTC 21:00)
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  visual-test:
    name: Playwright 스크린샷 비교
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 배포 반영 대기
        # push 직후에는 GitHub Pages 재배포가 끝나기 전일 수 있어 잠시 대기합니다.
        if: github.event_name == 'push'
        run: sleep 60

      - name: 시각 테스트 실행
        run: npm run test:visual
        env:
          TEST_URL: https://1597circle.github.io/SPOO/

      - name: 결과 리포트 업로드 (실패 시에도 항상 업로드)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          
